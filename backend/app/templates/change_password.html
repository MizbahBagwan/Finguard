{% extends "base.html" %}


{% block content %}


<div class="password-page">


<div class="password-card">


<div class="password-header">


<div class="password-icon">

<i class="fa-solid fa-lock"></i>

</div>


<div>

<h1>
Change Password
</h1>

<p>
Secure your FinGuard account
</p>

</div>


</div>




<form method="post" action="/password/update">


<div class="form-group">

<label>
Current Password
</label>


<div class="input-box">

<i class="fa-solid fa-key"></i>


<input
type="password"
name="current_password"
placeholder="Enter current password">


</div>

</div>





<div class="form-group">

<label>
New Password
</label>


<div class="input-box">

<i class="fa-solid fa-lock"></i>


<input
type="password"
name="new_password"
placeholder="Enter new password">


</div>

</div>





<div class="form-group">

<label>
Confirm Password
</label>


<div class="input-box">

<i class="fa-solid fa-check"></i>


<input
type="password"
name="confirm_password"
placeholder="Confirm new password">


</div>

</div>





<button class="update-btn">


<i class="fa-solid fa-shield-halved"></i>

Update Password


</button>



</form>


</div>


</div>





<style>


.password-page{

display:flex;

justify-content:center;

padding:60px;


}



.password-card{


width:520px;

background:
rgba(20,30,55,.85);


border-radius:22px;

padding:35px;


border:1px solid rgba(255,255,255,.08);


box-shadow:
0 20px 50px rgba(0,0,0,.35);


}



.password-header{


display:flex;

align-items:center;

gap:20px;

margin-bottom:35px;


}



.password-header h1{

color:white;

font-size:32px;

margin:0;

}



.password-header p{

color:#94a3b8;

}



.password-icon{


height:70px;

width:70px;

border-radius:50%;


display:flex;

justify-content:center;

align-items:center;


font-size:30px;


color:white;


background:
linear-gradient(
135deg,
#2563eb,
#06b6d4
);


}




.form-group{

margin-bottom:25px;

}



.form-group label{


color:#cbd5e1;

display:block;

margin-bottom:10px;


}




.input-box{


display:flex;

align-items:center;

gap:12px;


background:#0f172a;


border:1px solid #334155;


border-radius:12px;


padding:0 15px;


}



.input-box i{

color:#38bdf8;

}



.input-box input{


width:100%;

padding:15px;


background:transparent;


border:none;


outline:none;


color:white;


font-size:16px;


}



.update-btn{


width:100%;

padding:15px;


border:none;


border-radius:12px;


background:
linear-gradient(
135deg,
#2563eb,
#06b6d4
);


color:white;


font-weight:600;


font-size:16px;


cursor:pointer;


}



.update-btn:hover{


box-shadow:
0 10px 25px rgba(6,182,212,.35);


}


</style>



{% endblock %}
