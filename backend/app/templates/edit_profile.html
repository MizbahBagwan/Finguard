{% extends "base.html" %}

{% block content %}

<div class="profile-page">

    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <div>
                <h1>Edit Profile</h1>
                <p>Manage your FinGuard account information</p>
            </div>

        </div>


        <form method="post" action="/profile/update">

    {% if success %}
    <div class="success-message">
        <i class="fa-solid fa-circle-check"></i>
        {{ success }}
    </div>
    {% endif %}

    <div class="form-group">

        <label>Full Name</label>

        <div class="input-box">
            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                name="name"
                value="{{ user.username }}"
                placeholder="Enter your name"
                required>
        </div>

    </div>

    <div class="form-group">

        <label>Email Address</label>

        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>

            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                placeholder="Enter your email"
                required>
        </div>

    </div>

    <button type="submit" class="save-profile-btn">
        <i class="fa-solid fa-floppy-disk"></i>
        Save Profile
    </button>

</form>


<style>


.profile-page{

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:60px;

}



.profile-card{


    width:520px;

    background:
    rgba(20,30,55,0.85);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:22px;

    padding:35px;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.35);

    backdrop-filter:blur(12px);

}



.profile-header{

    display:flex;

    align-items:center;

    gap:20px;

    margin-bottom:35px;

}



.profile-header h1{

    font-size:32px;

    margin:0;

    color:white;

}



.profile-header p{

    color:#9ca9c7;

    margin-top:6px;

}



.avatar{


    width:70px;

    height:70px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;


    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );


    font-size:30px;

    color:white;

}




.form-group{

    margin-bottom:25px;

}



.form-group label{

    display:block;

    color:#cbd5e1;

    margin-bottom:10px;

    font-size:15px;

}



.input-box{

    display:flex;

    align-items:center;

    gap:12px;

    background:#0f172a;

    border:1px solid #334155;

    border-radius:12px;

    padding:0 15px;

}



.input-box i{

    color:#38bdf8;

}



.input-box input{


    width:100%;

    padding:15px;

    background:transparent;

    border:none;

    outline:none;

    color:white;

    font-size:16px;

}



.input-box input::placeholder{

    color:#64748b;

}



.save-profile-btn{


    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;


    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );


    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;


    transition:.3s;


}



.save-profile-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(6,182,212,.35);

}


</style>


{% endblock %}
