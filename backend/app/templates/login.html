<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinGuard Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f7fb;

        }


        .login-box {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }


        h2 {

            text-align: center;

            color: #1e3a8a;

            margin-bottom: 25px;

        }


        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        button {

            width: 100%;

            padding: 12px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

        }


        button:hover {

            background: #1d4ed8;

        }


        .message {

            text-align: center;

            margin-top: 15px;

            color: red;

        }


        .register {

            text-align: center;

            margin-top: 20px;

        }


        .register a {

            color: #2563eb;

            text-decoration: none;

        }


    </style>

</head>


<body>


<div class="login-box">


    <h2>
        FinGuard Login
    </h2>


    <form id="loginForm">


        <input

            type="email"

            id="email"

            placeholder="Enter email"

            required

        >



        <input

            type="password"

            id="password"

            placeholder="Enter password"

            required

        >



        <button type="submit">

            Login

        </button>


    </form>



    <div id="message" class="message"></div>



    <div class="register">

        Don't have an account?

        <a href="/register">

            Register

        </a>

    </div>


</div>




<script>


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){


        event.preventDefault();



        const email =
            document.getElementById("email").value;



        const password =
            document.getElementById("password").value;




        try {


            const response = await fetch(
                "/api/login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },


                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                }
            );



            const data = await response.json();




            if(data.success){


                document.getElementById("message").style.color =
                    "green";


                document.getElementById("message").innerHTML =
                    "Login successful...";



                setTimeout(function(){


                    window.location.href =
                        "/dashboard";


                },500);



            }

            else {


                document.getElementById("message").innerHTML =
                    data.message;


            }



        }


        catch(error){


            document.getElementById("message").innerHTML =
                "Server error";


            console.log(error);


        }



    }
);


</script>



</body>

</html>
