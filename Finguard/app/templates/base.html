<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FinGuard AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo"><span>🛡️</span><div><h2>FinGuard AI</h2><small>Financial Intelligence</small></div></div>
<nav class="menu">
<a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="/transactions"><i class="bi bi-credit-card"></i> Transactions</a>
<a href="/reports"><i class="bi bi-bar-chart"></i> Reports</a>
<a href="/settings"><i class="bi bi-gear"></i> Settings</a>
</nav>
</aside>
<main class="main">
<header class="topbar">
<input class="search" placeholder="Search">
<div class="profile"><i class="bi bi-bell"></i><img src="https://i.pravatar.cc/40"><span>Administrator</span></div>
</header>
{% block content %}{% endblock %}
<footer class="footer">© 2026 FinGuard AI</footer>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
